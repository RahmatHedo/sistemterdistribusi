# Konfigurasi Nginx sebagai load balancer untuk aplikasi chat terdistribusi
# Salin file ini ke folder conf/ Nginx Anda, atau include dari nginx.conf utama
#
# Lokasi default Nginx di Windows:
#   C:\nginx\conf\nginx.conf
#
# Cara pakai:
#   1. Ganti isi nginx.conf dengan file ini, ATAU
#   2. Include file ini dari blok http {} di nginx.conf utama

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Daftar backend server (3 instance Node.js)
    upstream chat_backend {
        # Round-robin (default) - tidak pakai sticky session
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
    }

    server {
        listen 80;
        server_name localhost;

        # Proxy REST API ke backend
        location /api {
            proxy_pass http://chat_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy WebSocket ke backend
        location /ws {
            proxy_pass http://chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeout untuk koneksi WebSocket (agar tidak diputus Nginx)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
